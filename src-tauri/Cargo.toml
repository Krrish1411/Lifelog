[package]
name = "lifelog"
version = "1.1.0"
description = "Minimal, private, offline-first productivity & focus OS"
authors = ["LifeLog Team"]
edition = "2021"

[lib]
name = "lifelog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
