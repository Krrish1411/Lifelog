name: Build LifeLog Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          cd ..
          cp android/app/build/outputs/apk/release/*-release.apk android/app/build/outputs/apk/release/LifeLog-Android.apk 2>/dev/null || cp android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/release/LifeLog-Android.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Release-APK
          path: android/app/build/outputs/apk/release/LifeLog-Android.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Extract Changelog for Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.1.2"
          fi
          sed -n "/^## 🌟 ${TAG}/,/^---/p" RELEASE.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            head -n 50 RELEASE.md > RELEASE_BODY.md
          fi

      - name: Attach APK to Lifelog-Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          repository: Krrish1411/Lifelog-Releases
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.2' }}
          name: LifeLog ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.2' }} — Sovereign Release
          body_path: RELEASE_BODY.md
          files: |
            android/app/build/outputs/apk/release/LifeLog-Android.apk
