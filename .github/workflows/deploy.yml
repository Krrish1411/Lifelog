name: Build & Deploy Web App to Lifelog-Releases

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "web-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Hardened Web & Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Hardened Web Production Assets
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to Public Lifelog-Releases (gh-pages)
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        if: env.RELEASES_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RELEASES_TOKEN }}
          external_repository: Krrish1411/Lifelog-Releases
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: false
