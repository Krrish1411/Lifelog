name: Build LifeLog Desktop Apps

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (Universal AppImage, Portable tar.gz, Deb & RPM)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (WebKitGTK, AppIndicator, RSVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            rpm

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Tauri Desktop (AppImage, Deb, RPM)
        run: npx tauri build

      - name: Patch Universal AppImage & Create Standalone Portable tar.gz
        run: |
          # 1. Download appimagetool for repacking AppImage
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract && mv squashfs-root appimagetool-extracted)

          # 2. Locate and extract Tauri-generated AppImage
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE_FILE=$(ls *.AppImage | head -n 1)
          chmod +x "$APPIMAGE_FILE"
          ./"$APPIMAGE_FILE" --appimage-extract

          # 3. Patch AppDir for Modern Linux Distros (Arch, Fedora, CachyOS, Ubuntu 24, Wayland & Mesa 24+)
          # Remove bundled Ubuntu libwayland to eliminate 'EGL_BAD_PARAMETER' Mesa abort
          rm -f squashfs-root/usr/lib/libwayland*.so*

          # Allow native Wayland with automatic X11 fallback
          sed -i 's/export GDK_BACKEND=x11/export GDK_BACKEND="${GDK_BACKEND:-wayland,x11}"/g' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh 2>/dev/null || true

          # Enforce hardware rendering safety fallback (prevents black screen on DMABUF)
          sed -i '2i export WEBKIT_DISABLE_DMABUF_RENDERER=1' squashfs-root/AppRun

          # Configure GTK window controls (minimize, maximize, close) for Linux environments
          mkdir -p squashfs-root/etc/xdg/gtk-3.0
          cat << 'GTKCFG' > squashfs-root/etc/xdg/gtk-3.0/settings.ini
[Settings]
gtk-decoration-layout=menu:minimize,maximize,close
GTKCFG
          sed -i '3i export XDG_CONFIG_DIRS="$APPDIR/etc/xdg:$XDG_CONFIG_DIRS"' squashfs-root/AppRun

          # 4. Repack the fixed Universal AppImage
          rm -f "$APPIMAGE_FILE"
          ARCH=x86_64 /tmp/appimagetool-extracted/AppRun squashfs-root "$APPIMAGE_FILE"
          chmod +x "$APPIMAGE_FILE"

          # 5. Create Standalone Portable Linux Bundle (contains full AppDir with WebKitGTK and AppIndicator)
          mkdir -p "$GITHUB_WORKSPACE/lifelog-linux-portable"
          cp -r squashfs-root/* "$GITHUB_WORKSPACE/lifelog-linux-portable/"

          cat << 'EOF' > "$GITHUB_WORKSPACE/lifelog-linux-portable/run.sh"
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          exec "$DIR/AppRun" "$@"
          EOF

          cat << 'EOF' > "$GITHUB_WORKSPACE/lifelog-linux-portable/install.sh"
          #!/bin/sh
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          DEST="$HOME/.local/share/lifelog"
          BIN_DIR="$HOME/.local/bin"
          APPS_DIR="$HOME/.local/share/applications"
          ICONS_DIR="$HOME/.local/share/icons/hicolor/512x512/apps"

          echo "Installing LifeLog to $DEST..."
          mkdir -p "$DEST" "$BIN_DIR" "$APPS_DIR" "$ICONS_DIR"
          cp -r "$DIR"/* "$DEST/"
          chmod +x "$DEST/AppRun" "$DEST/run.sh"

          ln -sf "$DEST/AppRun" "$BIN_DIR/lifelog"
          if [ -f "$DEST/LifeLog.png" ]; then
            cp "$DEST/LifeLog.png" "$ICONS_DIR/lifelog.png"
          elif [ -f "$DEST/lifelog.png" ]; then
            cp "$DEST/lifelog.png" "$ICONS_DIR/lifelog.png"
          fi

          cat << 'DESK' > "$APPS_DIR/lifelog.desktop"
          [Desktop Entry]
          Name=LifeLog
          Comment=Minimal, private, offline-first productivity & focus OS
          Exec=lifelog %U
          Icon=lifelog
          Terminal=false
          Type=Application
          Categories=Utility;Office;Productivity;
          StartupWMClass=lifelog
          DESK

          update-desktop-database "$APPS_DIR" 2>/dev/null || true
          echo "LifeLog installed successfully!"
          echo "You can launch it from your application menu or by running 'lifelog' in your terminal."
          EOF

          chmod +x "$GITHUB_WORKSPACE/lifelog-linux-portable/run.sh" "$GITHUB_WORKSPACE/lifelog-linux-portable/install.sh" "$GITHUB_WORKSPACE/lifelog-linux-portable/AppRun"
          tar -czvf "$GITHUB_WORKSPACE/LifeLog-Linux-x64-portable.tar.gz" -C "$GITHUB_WORKSPACE/lifelog-linux-portable" .

      - name: Upload Universal AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Linux Deb & RPM Packages & Portable Bundle
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Linux-Packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            LifeLog-Linux-x64-portable.tar.gz
          if-no-files-found: warn
          retention-days: 30

  build-windows:
    name: Build Windows (Native NSIS Setup .exe & Portable zip)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Tauri Desktop (NSIS Setup .exe)
        run: npx tauri build

      - name: Package Portable Windows Zip
        shell: bash
        run: |
          mkdir -p lifelog-windows-portable
          cp src-tauri/target/release/lifelog.exe lifelog-windows-portable/LifeLog.exe
          cp src-tauri/icons/icon.ico lifelog-windows-portable/icon.ico
          7z a LifeLog-Windows-x64-portable.zip ./lifelog-windows-portable/*

      - name: Upload Windows NSIS Setup .exe Installer
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Windows-Portable
          path: LifeLog-Windows-x64-portable.zip
          if-no-files-found: warn
          retention-days: 30

  build-macos:
    name: Build macOS (.dmg Disk Image)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Tauri Desktop (.dmg)
        run: npx tauri build

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30
