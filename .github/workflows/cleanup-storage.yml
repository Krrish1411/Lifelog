name: Storage & Workflow Run Purge

on:
  schedule:
    - cron: '0 3 * * *' # Run daily at 03:00 UTC to prevent storage quota exhaustion
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Storage Purge Script
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          python3 scripts/cleanup-storage.py --token "${{ secrets.RELEASES_TOKEN }}" --keep 1 --repos Krrish1411/Lifelog Krrish1411/Lifelog-Releases
