name: Build LifeLog Desktop Apps (Electron)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "desktop-build"
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build-linux:
    name: Build Linux (AppImage, Deb, tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 desktop-file-utils || sudo apt-get install -y libarchive-tools libfuse2t64 desktop-file-utils || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build Linux Desktop Packages
        run: |
          for i in 1 2 3; do
            echo "==> Packaging Linux desktop applications (attempt $i of 3)..."
            if npx electron-builder --linux --publish never; then
              echo "==> Linux packages built successfully!"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "==> Error: Packaging Linux failed after 3 attempts."
              exit 1
            fi
            echo "==> Attempt $i failed (likely transient 504 Gateway Time-out from external binary host). Waiting 20s before retry..."
            sleep 20
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Desktop-Linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: warn
          retention-days: 1

      - name: Extract Changelog for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -n "/^## 🌟 ${TAG}/,/^---/p" RELEASE.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            head -n 50 RELEASE.md > RELEASE_BODY.md
          fi

      - name: Attach Linux Packages to Lifelog-Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Krrish1411/Lifelog-Releases
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          name: LifeLog ${{ github.ref_name }} — Sovereign Release
          body_path: RELEASE_BODY.md
          files: |
            release/*Linux*.AppImage
            release/*Linux*.deb
            release/*Linux*.tar.gz

  build-windows:
    name: Build Windows (Setup .exe & Portable .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build Windows Desktop Packages
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "==> Packaging Windows desktop applications (attempt $i of 3)..."
            if npx electron-builder --win --publish never; then
              echo "==> Windows packages built successfully!"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "==> Error: Packaging Windows failed after 3 attempts."
              exit 1
            fi
            echo "==> Attempt $i failed. Retrying in 20 seconds..."
            sleep 20
          done

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Desktop-Windows
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 1

      - name: Extract Changelog for Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -n "/^## 🌟 ${TAG}/,/^---/p" RELEASE.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            head -n 50 RELEASE.md > RELEASE_BODY.md
          fi

      - name: Attach Windows Packages to Lifelog-Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Krrish1411/Lifelog-Releases
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          name: LifeLog ${{ github.ref_name }} — Sovereign Release
          body_path: RELEASE_BODY.md
          files: |
            release/*Windows-Setup*.exe
            release/*Windows-Portable*.exe
            release/*.exe

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Build macOS Desktop Packages
        run: |
          for i in 1 2 3; do
            echo "==> Packaging macOS desktop applications (attempt $i of 3)..."
            if npx electron-builder --mac --publish never -c.mac.identity=null; then
              echo "==> macOS packages built successfully!"
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "==> Error: Packaging macOS failed after 3 attempts."
              exit 1
            fi
            echo "==> Attempt $i failed. Retrying in 20 seconds..."
            sleep 20
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Desktop-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 1

      - name: Extract Changelog for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -n "/^## 🌟 ${TAG}/,/^---/p" RELEASE.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            head -n 50 RELEASE.md > RELEASE_BODY.md
          fi

      - name: Attach macOS Packages to Lifelog-Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Krrish1411/Lifelog-Releases
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          name: LifeLog ${{ github.ref_name }} — Sovereign Release
          body_path: RELEASE_BODY.md
          files: |
            release/*macOS*.dmg
            release/*macOS*.zip

