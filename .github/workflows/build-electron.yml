name: Build LifeLog Desktop Apps (Electron)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "desktop-build"
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build-linux:
    name: Build Linux (AppImage, Deb, tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 desktop-file-utils || sudo apt-get install -y libarchive-tools libfuse2t64 desktop-file-utils || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Linux Desktop Packages
        run: npx electron-builder --linux --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Desktop-Linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: warn
          retention-days: 30

  build-windows:
    name: Build Windows (Setup .exe & Portable .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Windows Desktop Packages
        run: npx electron-builder --win --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Desktop-Windows
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 30

  build-macos:
    name: Build macOS (DMG & Zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Build macOS Desktop Packages
        run: npx electron-builder --mac --publish never -c.mac.identity=null

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LifeLog-Desktop-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 30

